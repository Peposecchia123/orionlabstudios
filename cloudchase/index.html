<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloud Chase</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Inter',sans-serif;
}

body{

background:
linear-gradient(180deg,#7bc6ff 0%,#9bd9ff 40%,#dff5ff 100%);

display:flex;
justify-content:center;
align-items:center;
text-align:center;

}

.cloud{

position:absolute;
background:white;
border-radius:100px;
opacity:.45;
filter:blur(2px);

animation:drift linear infinite;

}

.cloud::before,
.cloud::after{

content:"";
position:absolute;
background:white;
border-radius:50%;

}

.cloud::before{

width:60px;
height:60px;
left:18px;
top:-28px;

}

.cloud::after{

width:80px;
height:80px;
right:20px;
top:-42px;

}

.c1{

width:180px;
height:55px;

top:15%;
left:-220px;

animation-duration:60s;

}

.c2{

width:240px;
height:70px;

top:60%;
left:-260px;

animation-duration:90s;

}

.c3{

width:160px;
height:50px;

top:35%;
left:-180px;

animation-duration:75s;

}

.container{

position:relative;
z-index:2;

animation:fadeUp 2s ease forwards;

opacity:0;

}

h1{

font-size:74px;

font-weight:300;

letter-spacing:2px;

color:white;

text-shadow:0 4px 20px rgba(0,0,0,.18);

}

.subtitle{

margin-top:18px;

font-size:22px;

color:rgba(255,255,255,.92);

}

.small{

margin-top:10px;

font-size:16px;

color:rgba(255,255,255,.72);

}

.links{

margin-top:55px;

display:flex;

flex-direction:column;

gap:18px;

}

.links a{

color:white;

font-size:18px;

text-decoration:none;

transition:.25s;

}

.links a:hover{

transform:translateY(-2px);

opacity:.8;

}

.footer{

position:fixed;

bottom:28px;

width:100%;

text-align:center;

}

.footer a{

color:rgba(255,255,255,.7);

text-decoration:none;

}

@keyframes drift{

from{

transform:translateX(0);

}

to{

transform:translateX(calc(100vw + 450px));

}

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="container">

<h1>cloud chase</h1>

<div class="subtitle">

An adventure above the clouds.

</div>

<div class="small">

Coming Soon

</div>

<div class="links">

<a href="https://www.instagram.com/orionlabstudios" target="_blank">

instagram

</a>

<a href="/">

← orion lab studios

</a>

</div>

</div>

<div class="footer">

<a href="https://orionlabstudios.com">

orion lab studios

</a>

</div>

</body>

</html>
