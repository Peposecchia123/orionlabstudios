```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>orion lab studios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top,#474b52 0%,#2f3237 40%,#17181b 100%);

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

color:white;

}

body::after{

content:"";

position:fixed;
inset:0;

background:
repeating-linear-gradient(
90deg,
rgba(255,255,255,.015) 0px,
rgba(255,255,255,.015) 1px,
transparent 1px,
transparent 6px
);

pointer-events:none;

}

.container{

display:flex;
flex-direction:column;
align-items:center;
text-align:center;

transform:translateY(-5vh);

}

.title{

opacity:0;

animation:fadeIn 2s forwards,
float 8s ease-in-out infinite;

}

.title h1{

font-size:72px;
font-weight:300;
letter-spacing:8px;
color:#f0f0f0;

}

.title h2{

margin-top:8px;

font-size:20px;

font-weight:300;

letter-spacing:10px;

color:#9a9a9a;

}

.subtitle{

margin-top:42px;

font-size:18px;

color:#b9b9b9;

opacity:0;

animation:fadeIn 2s forwards;

animation-delay:.6s;

}

.section{

margin-top:42px;

font-size:12px;

letter-spacing:4px;

text-transform:uppercase;

color:#8a8a8a;

opacity:.7;

}

.links{

margin-top:16px;

display:flex;

flex-direction:column;

gap:16px;

opacity:0;

animation:fadeIn 2s forwards;

animation-delay:1.2s;

}

.links a{

color:#bfc8d2;

font-size:18px;

text-decoration:underline;

text-decoration-thickness:1px;

text-underline-offset:5px;

transition:all .25s ease;

}

.links a:hover{

color:white;

text-decoration-thickness:2px;

transform:translateX(6px);

}

.spacer{

height:34px;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-5px);}
100%{transform:translateY(0);}

}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>orion</h1>

<h2>lab studios</h2>

</div>

<div class="subtitle">

Independent app & game studio.

</div>

<div class="section">

Projects

</div>

<div class="links">

<a href="/cloudchase">

Cloud Chase →

</a>

</div>

<div class="spacer"></div>

<div class="section">

Studio

</div>

<div class="links">

<a href="https://www.instagram.com/orionlabstudios" target="_blank">

Instagram

</a>

</div>

</div>

</body>

</html>
```
